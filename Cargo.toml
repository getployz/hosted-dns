[package]
name = "hosted-dns"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-route53 = "1.125.0"
axum = "0.8.9"
base64 = "0.23.1"
bcrypt = "0.19.3"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
httpdate = "1.0.3"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "native-tokio", "tls12", "rustls-platform-verifier", "aws-lc-rs"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio", "http1", "http2"] }
instant-acme = "0.8.5"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-parser = "0.18.1"

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = "0.14.10"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tower = { version = "0.5.3", features = ["util"] }

# bcrypt is unusably slow unoptimised; keep tests fast.
[profile.dev.package.bcrypt]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
